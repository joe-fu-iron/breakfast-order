<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>早餐點餐助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .menu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s;
            opacity: 0;
        }

        .menu-content.open {
            max-height: 5000px; 
            opacity: 1;
            margin-top: 0.5rem;
        }

        .arrow-rotate { transition: transform 0.3s; }
        .rotate-180 { transform: rotate(180deg); }

        /* 防止手機版橡皮筋回彈效果影響體驗 */
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        .admin-edit-pulse {
            animation: pulse-bg 2s infinite;
        }

        @keyframes pulse-bg {
            0% { background-color: rgba(254, 249, 195, 0.5); }
            50% { background-color: rgba(254, 249, 195, 1); }
            100% { background-color: rgba(254, 249, 195, 0.5); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-40">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">

            <h1 class="text-2xl font-black tracking-tighter">早餐點餐助手</h1>
            <p class="text-emerald-200 text-[10px] mt-1 font-bold tracking-widest uppercase">Smart Ordering System</p>
