<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>早餐點餐助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .menu-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; opacity: 0; }
        .menu-content.open { max-height: 5000px; opacity: 1; margin-top: 0.5rem; }
        .arrow-rotate { transition: transform 0.3s; }
        .rotate-180 { transform: rotate(180deg); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-40">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">
        <header class="bg-emerald-500 p-6 text-white text-center shadow-lg">
            <h1 class="text-2xl font-black tracking-tighter">早餐點餐助手</h1>
            <p class="text-emerald-100 text-[10px] mt-1 font-bold tracking-widest uppercase">LINE Format Optimized</p>
        </header>

        <section class="p-4 border-b bg-white sticky top-0 z-10 shadow-sm flex items-center space-x-3">
            <label class="text-emerald-900 text-sm font-black shrink-0">訂購人</label>
            <input type="text" id="user-name" class="flex-grow border-b-2 border-gray-100 focus:border-emerald-500 outline-none px-2 py-1 text-sm font-medium transition-all" placeholder="請輸入姓名..." onchange="saveUserData()">
        </section>

        <main class="flex-grow p-4 space-y-3" id="menu-accordion"></main>

        <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-gray-100 p-5 shadow-[0_-10px_30px_-10px_rgba(0,0,0,0.1)] z-20 safe-bottom">
            <div class="flex justify-between items-center mb-4 px-1">
                <div class="flex flex-col">
                    <span class="text-gray-400 text-[10px] font-bold">已選份數</span>
                    <span class="text-gray-700 font-black"><span id="cart-count" class="text-emerald-600 text-xl">0</span> 份</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-gray-400 text-[10px] font-bold">總計金額</span>
                    <span class="text-3xl font-black text-emerald-600">$<span id="cart-total">0</span></span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="clearCart()" class="bg-gray-100 p-4 rounded-2xl text-gray-400 active:scale-90">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
                <button onclick="showConfirmModal()" class="flex-grow bg-[#06C755] text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center space-x-2 active:scale-95">
                    <span class="text-lg">預覽點餐內容</span>
                </button>
            </div>
        </footer>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-[2.5rem] p-8 shadow-2xl animate-slide-up">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span id="modal-cat" class="text-emerald-600 text-[10px] font-black uppercase tracking-widest"></span>
                    <h3 id="modal-title" class="text-xl font-black text-gray-800"></h3>
                </div>
                <button onclick="closeModal()" class="text-gray-400 p-2 text-xl">✕</button>
            </div>
            <p id="modal-price-display" class="text-3xl font-black text-emerald-600 mb-6"></p>
            <div id="modal-options" class="space-y-6 max-h-[45vh] overflow-y-auto pr-2"></div>
            
            <div class="flex items-center justify-between bg-slate-50 p-4 rounded-2xl my-6 border border-slate-100">
                <span class="font-bold text-gray-400 text-xs tracking-widest uppercase">數量</span>
                <div class="flex items-center space-x-6">
                    <button onclick="changeQty(-1)" class="w-10 h-10 bg-white border rounded-xl font-bold shadow-sm active:bg-gray-50">-</button>
                    <span id="modal-qty" class="text-xl font-black w-6 text-center">1</span>
                    <button onclick="changeQty(1)" class="w-10 h-10 bg-white border border-emerald-500 rounded-xl font-bold text-emerald-600 shadow-sm active:bg-emerald-50">+</button>
                </div>
            </div>
            <button onclick="addToCart()" class="w-full py-4 bg-emerald-600 rounded-2xl font-black text-white text-lg active:scale-95 shadow-lg">確認加入清單</button>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] overflow-hidden shadow-2xl animate-slide-up">
            <div class="bg-emerald-600 p-6 text-white text-center">
                <h3 class="text-lg font-black tracking-widest">訂單詳情確認</h3>
            </div>
            <div class="p-6 max-h-[40vh] overflow-y-auto" id="confirm-list"></div>
            <div class="px-6 pb-4">
                <textarea id="order-note" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm focus:outline-none focus:border-emerald-500" rows="2" placeholder="備註 (如：蛋半熟、去冰、不加洋蔥...)"></textarea>
            </div>
            <div class="p-8 bg-slate-50 border-t">
                <div class="flex justify-between items-center mb-6">
                    <span class="font-bold text-gray-500">總計</span>
                    <span class="text-3xl font-black text-emerald-600">$<span id="confirm-total">0</span></span>
                </div>
                <div class="flex gap-3">
                    <button onclick="closeConfirmModal()" class="flex-1 py-4 bg-white border border-gray-200 text-gray-400 font-bold rounded-2xl">返回</button>
                    <button onclick="sendToLine()" class="flex-[2] py-4 bg-[#06C755] text-white font-black rounded-2xl shadow-lg active:scale-95">發送 LINE</button>
                </div>
            </div>
        </div>
    </div>

                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleCategory(id) {
            document.getElementById(`content-${id}`).classList.toggle('open');
            document.getElementById(`arrow-${id}`).classList.toggle('rotate-180');
        }

        function openModal(catId, itemIdx) {
            const cat = MENU_DATA.find(c => c.id === catId);
            tempItem = { ...cat.items[itemIdx], catName: cat.name };
            tempQty = 1;
            document.getElementById('modal-cat').innerText = tempItem.catName;
            document.getElementById('modal-title').innerText = tempItem.name;
            document.getElementById('modal-qty').innerText = tempQty;
            const optBox = document.getElementById('modal-options');
            optBox.innerHTML = '';
            
            if (!['巧克力牛乳', '草莓牛乳', '麥芽牛乳'].includes(tempItem.name)) {
                if (tempItem.types) renderOptions(optBox, '尺寸選擇', Object.keys(tempItem.types));
                if (tempItem.options) tempItem.options.forEach(o => renderOptions(optBox, o.title, o.choices));
                if (tempItem.temps) renderOptions(optBox, '溫度', tempItem.temps);
                if (tempItem.addCheese) renderOptions(optBox, '加起司 (+10元)', ['不加起司', '加起司 (+10)']);
            } else {
                optBox.innerHTML = '<p class="text-sm text-gray-500 font-bold">規格：每瓶 30 元</p>';
            }
            
            updateModalPrice();
            document.getElementById('modal').classList.remove('hidden');
        }

        function renderOptions(container, title, choices) {
            const div = document.createElement('div');
            div.innerHTML = `
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">${title}</p>
                <div class="flex flex-wrap gap-2">
                    ${choices.map((c, idx) => `
                        <button onclick="selectOption(this)" class="option-btn px-4 py-2.5 rounded-xl border-2 font-bold text-sm transition-all ${idx === 0 ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-500 border-slate-100'}">${c}</button>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        }

        function selectOption(btn) {
            btn.parentElement.querySelectorAll('button').forEach(b => {
                b.className = "option-btn px-4 py-2.5 rounded-xl border-2 font-bold text-sm bg-white text-slate-500 border-slate-100";
            });
            btn.className = "option-btn px-4 py-2.5 rounded-xl border-2 font-bold text-sm bg-emerald-600 text-white border-emerald-600 shadow-md";
            updateModalPrice();
        }

        function updateModalPrice() {
            let total = tempItem.price;
            document.querySelectorAll('.option-btn.text-white').forEach(btn => {
                const text = btn.innerText;
                if (text.includes('+')) total += parseInt(text.match(/\d+/)[0]);
                if (tempItem.types && tempItem.types[text]) total = tempItem.types[text];
            });
            document.getElementById('modal-price-display').innerText = `$${total * tempQty}`;
        }

        function changeQty(v) {
            tempQty = Math.max(1, tempQty + v);
            document.getElementById('modal-qty').innerText = tempQty;
            updateModalPrice();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function addToCart() {
            let unitPrice = tempItem.price;
            const chosenOpts = [];
            document.querySelectorAll('.option-btn.text-white').forEach(btn => {
                const text = btn.innerText.split('(')[0].trim();
                if (!text.includes('不加')) {
                    chosenOpts.push(text);
                    if (btn.innerText.includes('+')) unitPrice += parseInt(btn.innerText.match(/\d+/)[0]);
                    if (tempItem.types && tempItem.types[text]) unitPrice = tempItem.types[text];
                }
            });
            cart.push({ name: tempItem.name, price: unitPrice, qty: tempQty, opts: chosenOpts.join('') });
            updateCartUI();
            closeModal();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
        }

        function clearCart() { if (confirm('確定要清空點餐清單嗎？')) { cart = []; updateCartUI(); } }

        function showConfirmModal() {
            if (cart.length === 0) return alert('清單是空的！');
            const name = document.getElementById('user-name').value;
            if (!name) return alert('請輸入訂購人姓名！');
            const list = document.getElementById('confirm-list');
            list.innerHTML = `<p class="font-bold text-gray-800 border-b pb-2 mb-4">👤 訂購人：${name}</p>`;
            cart.forEach((item, idx) => {
                list.innerHTML += `
                    <div class="mb-3 bg-slate-50 p-4 rounded-2xl flex justify-between items-center border border-slate-100">
                        <div class="flex-grow">
                            <p class="font-bold text-gray-700">${item.opts}${item.name} x${item.qty}</p>
                        </div>
                        <div class="text-right ml-4">
                            <span class="font-black text-emerald-600">$${item.price * item.qty}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('confirm-total').innerText = document.getElementById('cart-total').innerText;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() { document.getElementById('confirm-modal').classList.add('hidden'); }

        function sendToLine() {
            const name = document.getElementById('user-name').value;
            const note = document.getElementById('order-note').value.trim();
            const total = document.getElementById('cart-total').innerText;
            
            let msg = `【 ☕ 早安點餐單 】\n`;
            msg += `👤 訂購人：${name}\n`;
            msg += `━━━━━━━━━━\n`;
            
            cart.forEach((item, idx) => {
                msg += `${idx + 1}. ${item.opts}${item.name}x${item.qty}-${item.price * item.qty}元\n`;
            });
            
            if (note) {
                msg += `━━━━━━━━━━━\n`;
                msg += `📝 備註：${note}\n`;
            }
            
            msg += `━━━━━━━━━━━\n`;
            msg += `💰 總計：${total} 元`;
            
            window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(msg)}`;
        }

        function saveUserData() { localStorage.setItem('breakfast_user_name', document.getElementById('user-name').value); }

        window.onload = () => {
            document.getElementById('user-name').value = localStorage.getItem('breakfast_user_name') || '';
            renderMenu();
        };
    </script>
</body>
</html>
