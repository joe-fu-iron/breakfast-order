<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>早餐點餐助手 - 含備註功能</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .menu-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; opacity: 0; }
        .menu-content.open { max-height: 5000px; opacity: 1; margin-top: 0.5rem; }
        .arrow-rotate { transition: transform 0.3s; }
        .rotate-180 { transform: rotate(180deg); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .choice-btn { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-40">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">
        <!-- Header -->
        <header class="bg-emerald-600 p-6 text-white text-center relative shadow-lg">
            <h1 class="text-2xl font-black tracking-tighter">早餐點餐助手</h1>
            <p class="text-emerald-100 text-[10px] mt-1 font-bold tracking-widest uppercase">Smart Ordering System</p>
        </header>

        <!-- User Input -->
        <section class="p-4 border-b bg-white sticky top-0 z-10 shadow-sm flex items-center space-x-3">
            <label class="text-emerald-900 text-sm font-black shrink-0">訂購人</label>
            <input type="text" id="user-name" class="flex-grow border-b-2 border-gray-100 focus:border-emerald-500 outline-none px-2 py-1 text-sm font-medium transition-all" placeholder="請輸入姓名..." onchange="saveUserData()">
        </section>

        <!-- Menu Accordion -->
        <main class="flex-grow p-4 space-y-4" id="menu-accordion"></main>

        <!-- Footer Checkout -->
        <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-gray-100 p-5 shadow-[0_-10px_30px_-10px_rgba(0,0,0,0.1)] z-20 safe-bottom">
            <div class="flex justify-between items-center mb-4 px-1">
                <div class="flex flex-col">
                    <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Total Items</span>
                    <span class="text-gray-700 font-black"><span id="cart-count" class="text-emerald-600 text-xl">0</span> 份</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Grand Total</span>
                    <span class="text-3xl font-black text-emerald-600">$<span id="cart-total">0</span></span>
                </div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="clearCart()" class="bg-gray-100 p-4 rounded-2xl text-gray-400 hover:bg-red-50 hover:text-red-400 transition-all active:scale-90">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
                <button onclick="showConfirmModal()" class="flex-grow bg-[#06C755] hover:bg-[#05b34d] text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-100 flex items-center justify-center space-x-2 transition-all active:scale-95">
                    <span class="text-lg">確認清單並發送</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- Order Modal (Item Selection) -->
    <div id="modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2rem] p-8 shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h3 id="modal-title" class="text-2xl font-black text-gray-800"></h3>
                    <p id="modal-price-display" class="text-xl font-bold text-emerald-600 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="bg-gray-100 text-gray-400 p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-options" class="space-y-6 max-h-[40vh] overflow-y-auto pr-2 no-scrollbar"></div>
            <div class="flex items-center justify-between bg-slate-50 p-5 rounded-[1.5rem] my-8">
                <span class="font-black text-slate-500 uppercase text-xs tracking-widest">數量</span>
                <div class="flex items-center space-x-8">
                    <button onclick="changeQty(-1)" class="w-12 h-12 bg-white border-2 border-slate-200 rounded-2xl shadow-sm text-2xl font-bold">-</button>
                    <span id="modal-qty" class="text-2xl font-black w-6 text-center">1</span>
                    <button onclick="changeQty(1)" class="w-12 h-12 bg-white border-2 border-emerald-500 rounded-2xl shadow-sm text-2xl font-bold text-emerald-600">+</button>
                </div>
            </div>
            <button onclick="addToCart()" class="w-full py-5 bg-emerald-600 rounded-[1.5rem] font-black text-white text-lg shadow-xl shadow-emerald-100 active:scale-95 transition-all">確認加入</button>
        </div>
    </div>

    <!-- Confirm Modal (Final Check with Note) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-300">
            <div class="bg-emerald-600 p-6 text-white text-center">
                <h3 class="text-xl font-black">最後確認點餐內容</h3>
                <p class="text-emerald-100 text-xs mt-1">請核對您的餐點明細</p>
            </div>
            <div class="p-6 max-h-[50vh] overflow-y-auto no-scrollbar" id="confirm-list">
                <!-- 內容由 JS 動態生成 -->
            </div>
            <!-- 其他備註欄位 -->
            <div class="px-6 pb-4">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">其他備註 (如：不加洋蔥、飲料去冰)</label>
                <textarea id="order-note" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 transition-all" rows="2" placeholder="有什麼想交代的嗎..."></textarea>
            </div>
            <div class="p-6 bg-slate-50 border-t border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <span class="font-bold text-gray-500">總計金額</span>
                    <span class="text-2xl font-black text-emerald-600">$<span id="confirm-total">0</span></span>
                </div>
                <div class="flex gap-3">
                    <button onclick="closeConfirmModal()" class="flex-1 py-4 bg-white border-2 border-gray-200 text-gray-400 font-bold rounded-2xl active:scale-95 transition-all">修改</button>
                    <button onclick="executeSend()" class="flex-[2] py-4 bg-[#06C755] text-white font-black rounded-2xl shadow-lg shadow-emerald-100 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span>發送 LINE</span>
                    </button>
                </div>
                <p id="action-hint" class="text-center text-[10px] text-emerald-600 mt-3 font-bold hidden">正在前往 LINE...</p>
            </div>
        </div>
    </div>

    <script>
        const MENU = [
            { id: 'jam', name: '🍓 果醬系列 (吐司/厚片)', items: [
                { id: 'j1', name: '花生果醬', price: 20, types: { '吐司': 0, '厚片': 10 } },
                { id: 'j2', name: '草莓果醬', price: 20, types: { '吐司': 0, '厚片': 10 } },
                { id: 'j3', name: '巧克力果醬', price: 20, types: { '吐司': 0, '厚片': 10 } },
                { id: 'j4', name: '奶酥果醬', price: 20, types: { '吐司': 0, '厚片': 10 } },
                { id: 'j5', name: '藍莓果醬', price: 20, types: { '吐司': 0, '厚片': 10 } },
                { id: 'j6', name: '香蕉果醬', price: 20, types: { '吐司': 0, '厚片': 10 } },
                { id: 'j7', name: '藍莓乳酪果醬', price: 30, types: { '吐司': 0, '厚片': 10 } }
            ]},
            { id: 'combo', name: '🍱 經典組合套餐 (附中紅茶)', items: [
                { id: 'c1', name: '1號餐 中港套餐', price: 80 },
                { id: 'c2', name: '2號餐 兒童套餐', price: 80 },
                { id: 'c3', name: '3號餐 招牌總匯', price: 90 },
                { id: 'c4', name: '4號餐 鐵板麵套餐', price: 90, options: [{ title: '口味', choices: ['黑胡椒', '蘑菇'] }] },
                { id: 'c5', name: '5號餐 大麥克套餐', price: 90 },
                { id: 'c6', name: '6號餐 蛋腸堡套餐', price: 90 }
            ]},
            { id: 'breads', name: '🍞 吐司 / 漢堡系列', items: [
                { id: 'b1', name: '煎蛋', price: 30, types: { '吐司': 0, '漢堡': 5 } },
                { id: 'b2', name: '起司蛋', price: 35, types: { '吐司': 0, '漢堡': 5 } },
                { id: 'b3', name: '火腿蛋', price: 35, types: { '吐司': 0, '漢堡': 5 } },
                { id: 'b4', name: '豬肉蛋', price: 40, types: { '吐司': 0, '漢堡': 10 } },
                { id: 'b5', name: '培根蛋', price: 40, types: { '吐司': 0, '漢堡': 10 } },
                { id: 'b6', name: '肉鬆蛋', price: 40, types: { '吐司': 0, '漢堡': 10 } },
                { id: 'b9', name: '里肌蛋', price: 50, types: { '吐司': 0, '漢堡': 10 } },
                { id: 'b10', name: '鮪魚蛋', price: 50, types: { '吐司': 0, '漢堡': 10 } },
                { id: 'b15', name: '咔拉雞蛋(原/辣)', price: 70, types: { '吐司': 0, '漢堡': 10 } }
            ]},
            { id: 'eggrolls', name: '🍳 蛋餅 / 河粉 (起司+10)', items: [
                { id: 'e1', name: '原味', price: 25, types: { '蛋餅': 0, '河粉': 35 }, addCheese: true },
                { id: 'e2', name: '起司', price: 30, types: { '蛋餅': 0, '河粉': 45 }, addCheese: true },
                { id: 'e3', name: '火腿', price: 35, types: { '蛋餅': 0, '河粉': 45 }, addCheese: true },
                { id: 'e4', name: '玉米', price: 40, types: { '蛋餅': 0, '河粉': 50 }, addCheese: true },
                { id: 'e11', name: '里肌', price: 50, types: { '蛋餅': 0, '河粉': 60 }, addCheese: true },
                { id: 'e12', name: '鮪魚', price: 50, types: { '蛋餅': 0, '河粉': 60 }, addCheese: true }
            ]},
            { id: 'noodle', name: '🍝 鐵板麵系列 (附蛋)', items: [
                { id: 'n1', name: '蘑菇麵', price: 50 },
                { id: 'n2', name: '黑胡椒麵', price: 50 },
                { id: 'n6', name: '塔香辣肉醬麵', price: 70 },
                { id: 'n8', name: '泰式打拋豬麵', price: 70 }
            ]},
            { id: 'fried', name: '🍟 炸物 / 單點類', items: [
                { id: 'f1', name: '荷包蛋', price: 15 },
                { id: 'f8', name: '薯條', price: 35 },
                { id: 'f13', name: '雞塊 (5塊)', price: 40 },
                { id: 'f16', name: '煎餃 (8顆)', price: 40 },
                { id: 'f18', name: '蘿蔔糕 (2片)', price: 35, options: [{ title: '加購', choices: ['不加蛋', '加蛋 (+15)'] }] }
            ]},
            { id: 'drinks', name: '🥤 飲料類 (中 / 大)', items: [
                { id: 'd1', name: '紅茶', price: 15, sizes: { '中': 0, '大': 5 }, hasTemp: true },
                { id: 'd2', name: '豆漿 / 無糖豆漿', price: 20, sizes: { '中': 0, '大': 5 }, hasTemp: true },
                { id: 'd3', name: '奶茶', price: 20, sizes: { '中': 0, '大': 5 }, hasTemp: true },
                { id: 'd5', name: '鮮奶茶', price: 25, sizes: { '中': 0, '大': 10 }, hasTemp: true },
                { id: 'd6', name: '美式咖啡', price: 35, sizes: { '中': 0, '大': 15 }, hasTemp: true }
            ]}
        ];

        let cart = [];
        let tempItem = null;
        let tempQty = 1;

        function renderMenu() {
            const container = document.getElementById('menu-accordion');
            container.innerHTML = '';
            MENU.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'border border-gray-100 rounded-3xl bg-white overflow-hidden shadow-sm';
                section.innerHTML = `
                    <button onclick="toggleCategory('${cat.id}')" class="w-full flex justify-between items-center p-6 hover:bg-emerald-50 transition-colors">
                        <span class="font-black text-gray-700">${cat.name}</span>
                        <svg id="arrow-${cat.id}" class="w-5 h-5 text-emerald-600 arrow-rotate" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="content-${cat.id}" class="menu-content px-4">
                        <div class="pb-4 space-y-1 border-t border-gray-50 pt-2">
                            ${cat.items.map(item => `
                                <div onclick="openOrderModal('${cat.id}', '${item.id}')" class="flex justify-between items-center p-4 rounded-2xl hover:bg-slate-50 cursor-pointer transition-all active:scale-[0.98]">
                                    <span class="font-bold text-gray-800">${item.name}</span>
                                    <span class="text-emerald-600 font-black">$${item.price}~</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function toggleCategory(id) {
            const content = document.getElementById(`content-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            content.classList.toggle('open');
            arrow.classList.toggle('rotate-180');
        }

        function openOrderModal(catId, itemId) {
            const cat = MENU.find(c => c.id === catId);
            tempItem = cat.items.find(i => i.id === itemId);
            tempQty = 1;
            document.getElementById('modal-title').innerText = tempItem.name;
            document.getElementById('modal-qty').innerText = tempQty;
            const optBox = document.getElementById('modal-options');
            optBox.innerHTML = '';
            
            if (tempItem.types) addOptionUI(optBox, '品項規格', Object.keys(tempItem.types), 'types');
            if (tempItem.sizes) addOptionUI(optBox, '容量', Object.keys(tempItem.sizes), 'sizes');
            if (tempItem.hasTemp) addOptionUI(optBox, '溫度', ['冰', '溫']);
            if (tempItem.options) tempItem.options.forEach(o => addOptionUI(optBox, o.title, o.choices));
            if (tempItem.addCheese) addOptionUI(optBox, '加購', ['不加起司', '加起司 (+10)']);
            
            calcModalPrice();
            document.getElementById('modal').classList.remove('hidden');
        }

        function addOptionUI(box, title, choices, key) {
            const wrap = document.createElement('div');
            wrap.innerHTML = `
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">${title}</p>
                <div class="flex flex-wrap gap-2">
                    ${choices.map((c, idx) => {
                        let label = c;
                        if (key) {
                            const extra = tempItem[key][c];
                            if (extra > 0) label += ` (+$${extra})`;
                        }
                        return `<button onclick="handleOptionSelect(this)" class="choice-btn px-5 py-3 rounded-2xl border-2 font-bold transition-all ${idx===0?'bg-emerald-600 text-white border-emerald-600 shadow-md':'bg-white text-slate-500 border-slate-100'}">${label}</button>`;
                    }).join('')}
                </div>
            `;
            box.appendChild(wrap);
        }

        function handleOptionSelect(btn) {
            btn.parentElement.querySelectorAll('.choice-btn').forEach(b => {
                b.className = "choice-btn px-5 py-3 rounded-2xl border-2 font-bold transition-all bg-white text-slate-500 border-slate-100";
            });
            btn.className = "choice-btn px-5 py-3 rounded-2xl border-2 font-bold transition-all bg-emerald-600 text-white border-emerald-600 shadow-md";
            calcModalPrice();
        }

        function calcModalPrice() {
            let p = tempItem.price;
            document.querySelectorAll('.choice-btn.text-white').forEach(b => {
                const t = b.innerText;
                if (t.includes('+$')) p += parseInt(t.split('+$')[1]);
                else if (t.includes('+')) {
                    const match = t.match(/\+(\d+)/);
                    if (match) p += parseInt(match[1]);
                }
            });
            document.getElementById('modal-price-display').innerText = `$${p * tempQty}`;
        }

        function changeQty(v) {
            tempQty = Math.max(1, tempQty + v);
            document.getElementById('modal-qty').innerText = tempQty;
            calcModalPrice();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function addToCart() {
            const selections = [];
            let price = tempItem.price;
            document.querySelectorAll('.choice-btn.text-white').forEach(b => {
                const t = b.innerText;
                if (!t.includes("不加")) {
                    selections.push(t.split(' (')[0].trim());
                    if (t.includes('+$')) price += parseInt(t.split('+$')[1]);
                    else if (t.includes('+')) {
                        const match = t.match(/\+(\d+)/);
                        if (match) price += parseInt(match[1]);
                    }
                }
            });
            cart.push({ name: tempItem.name, unit: price, qty: tempQty, opts: selections.join('') });
            refreshCartUI();
            closeModal();
        }

        function refreshCartUI() {
            const total = cart.reduce((s, i) => s + (i.unit * i.qty), 0);
            const count = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-count').innerText = count;
        }

        function clearCart() { if(confirm('要清空目前的所有餐點嗎？')) { cart = []; refreshCartUI(); } }

        function saveUserData() { localStorage.setItem('user_name', document.getElementById('user-name').value); }

        function showConfirmModal() {
            const name = document.getElementById('user-name').value;
            if (!name) { alert('請先輸入訂購人姓名！'); return; }
            if (cart.length === 0) { alert('清單是空的喔！'); return; }

            const listDiv = document.getElementById('confirm-list');
            listDiv.innerHTML = `<p class="mb-4 text-gray-800 font-bold border-b pb-2">訂購人：${name}</p>`;
            
            cart.forEach((i, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100";
                itemDiv.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-grow">
                            <p class="font-black text-gray-700">${idx+1}. ${i.name}</p>
                            <p class="text-xs text-gray-400 font-bold mt-1">${i.opts || '標準版本'}</p>
                        </div>
                        <div class="text-right ml-4">
                            <p class="text-emerald-600 font-black">$${i.unit * i.qty}</p>
                            <p class="text-[10px] text-gray-400 font-bold">x ${i.qty}</p>
                        </div>
                    </div>
                `;
                listDiv.appendChild(itemDiv);
            });

            document.getElementById('confirm-total').innerText = document.getElementById('cart-total').innerText;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() { document.getElementById('confirm-modal').classList.add('hidden'); }

        function executeSend() {
            const name = document.getElementById('user-name').value || '未署名';
            const note = document.getElementById('order-note').value.trim();
            
            let msg = `【早安點餐】👤：${name}\n━━━━━━━━━━━━━━\n`;
            cart.forEach((i, idx) => {
                const optStr = i.opts ? `(${i.opts})` : '';
                msg += `${idx+1}. ${i.name}${optStr} x${i.qty} $${i.unit * i.qty}\n`;
            });
            msg += `━━━━━━━━━━━━━━\n`;
            if (note) msg += `📝 備註：${note}\n━━━━━━━━━━━━━━\n`;
            msg += `總金額：$ ${document.getElementById('cart-total').innerText}`;
            
            const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(msg)}`;
            document.getElementById('action-hint').classList.remove('hidden');
            window.location.href = lineUrl;

            setTimeout(() => {
                const area = document.createElement('textarea');
                area.value = msg; document.body.appendChild(area); area.select();
                document.execCommand('copy'); document.body.removeChild(area);
                document.getElementById('action-hint').innerText = "已為您複製訊息至剪貼簿 ✅";
            }, 2000);
        }

        document.getElementById('user-name').value = localStorage.getItem('user_name') || '';
        renderMenu();
    </script>
</body>
</html>
