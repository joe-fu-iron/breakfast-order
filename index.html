<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>早餐點餐助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .menu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s;
            opacity: 0;
        }

        .menu-content.open {
            max-height: 5000px; 
            opacity: 1;
            margin-top: 0.5rem;
        }

        .arrow-rotate { transition: transform 0.3s; }
        .rotate-180 { transform: rotate(180deg); }

        /* 防止手機版橡皮筋回彈效果影響體驗 */
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        .admin-edit-pulse {
            animation: pulse-bg 2s infinite;
        }

        @keyframes pulse-bg {
            0% { background-color: rgba(254, 249, 195, 0.5); }
            50% { background-color: rgba(254, 249, 195, 1); }
            100% { background-color: rgba(254, 249, 195, 0.5); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-40">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">
        
        <!-- Top Header -->
        <header class="bg-emerald-800 p-6 text-white text-center relative shadow-lg">
            <h1 class="text-2xl font-black tracking-tighter">早餐點餐助手</h1>
            <p class="text-emerald-200 text-[10px] mt-1 font-bold tracking-widest uppercase">Smart Ordering System</p>
            
            <!-- 管理員模式切換鈕 -->
            <button onclick="toggleAdminMode()" id="admin-btn" class="absolute right-4 top-1/2 -translate-y-1/2 p-2 rounded-xl bg-emerald-700/50 hover:bg-emerald-600 transition-all active:scale-90 border border-emerald-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </header>

        <!-- 管理員模式橫幅 -->
        <div id="admin-banner" class="hidden bg-orange-500 text-white text-[11px] py-1.5 text-center font-bold animate-pulse">
            ⚠️ 目前為「價格編輯模式」，點擊價格即可修改
        </div>

        <!-- 使用者姓名輸入 -->
        <section class="p-4 border-b bg-white sticky top-0 z-10 shadow-sm flex items-center space-x-3">
            <label class="text-emerald-900 text-sm font-black shrink-0">訂購人</label>
            <input type="text" id="user-name" class="flex-grow border-b-2 border-gray-100 focus:border-emerald-500 outline-none px-2 py-1 text-sm font-medium transition-all" placeholder="請輸入姓名..." onchange="saveUserData()">
        </section>

        <!-- 菜單列表容器 -->
        <main class="flex-grow p-4 space-y-4" id="menu-accordion"></main>

        <!-- 底部結帳浮動欄 -->
        <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-gray-100 p-5 shadow-[0_-10px_30px_-10px_rgba(0,0,0,0.1)] z-20 safe-bottom">
            <div class="flex justify-between items-center mb-4 px-1">
                <div class="flex flex-col">
                    <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Total Items</span>
                    <span class="text-gray-700 font-black"><span id="cart-count" class="text-emerald-600 text-xl">0</span> 份餐點</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Grand Total</span>
                    <span class="text-3xl font-black text-orange-600">$<span id="cart-total">0</span></span>
                </div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="clearCart()" class="bg-gray-100 p-4 rounded-2xl text-gray-400 hover:bg-red-50 hover:text-red-400 transition-all active:scale-90" title="清空購物車">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
                <button onclick="exportToLine()" class="flex-grow bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-200 flex items-center justify-center space-x-2 transition-all active:scale-95">
                    <span class="text-lg">複製 LINE 點餐訊息</span>
                </button>
            </div>
            <p id="copy-msg" class="text-center text-emerald-600 text-[10px] mt-3 hidden font-black tracking-widest animate-bounce">COPIED TO CLIPBOARD ✅</p>
        </footer>
    </div>

    <!-- 點餐 Modal -->
    <div id="modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2rem] p-8 shadow-2xl animate-slide-up">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h3 id="modal-title" class="text-2xl font-black text-gray-800"></h3>
                    <p id="modal-price-display" class="text-xl font-bold text-emerald-600 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="bg-gray-100 text-gray-400 p-2 rounded-full hover:bg-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div id="modal-options" class="space-y-6 max-h-[45vh] overflow-y-auto pr-2 no-scrollbar"></div>

            <div class="flex items-center justify-between bg-slate-50 p-5 rounded-[1.5rem] my-8">
                <span class="font-black text-slate-500 uppercase text-xs tracking-widest">Quantity</span>
                <div class="flex items-center space-x-8">
                    <button onclick="changeQty(-1)" class="w-12 h-12 bg-white border-2 border-slate-200 rounded-2xl shadow-sm text-2xl font-bold text-slate-400 active:scale-90 transition-all">-</button>
                    <span id="modal-qty" class="text-2xl font-black w-6 text-center text-slate-700">1</span>
                    <button onclick="changeQty(1)" class="w-12 h-12 bg-white border-2 border-emerald-500 rounded-2xl shadow-sm text-2xl font-bold text-emerald-600 active:scale-90 transition-all">+</button>
                </div>
            </div>

            <button onclick="addToCart()" class="w-full py-5 bg-emerald-600 rounded-[1.5rem] font-black text-white text-lg shadow-xl shadow-emerald-100 active:scale-95 transition-all">確認加入</button>
        </div>
    </div>

    <script>
        // 原始菜單數據
        const INITIAL_MENU = [
            { id: 'combo', name: '🍱 經典套餐 (附中紅茶)', items: [
                { id: 'c1', name: '中港套餐', price: 80 }, { id: 'c2', name: '兒童套餐', price: 80 }, { id: 'c3', name: '招牌總匯', price: 90 },
                { id: 'c4', name: '鐵板麵套餐', price: 90, options: [{ title: '口味', choices: ['黑胡椒', '蘑菇'] }] },
                { id: 'c5', name: '大麥克套餐', price: 90 }, { id: 'c6', name: '蛋腸堡套餐', price: 90 }
            ]},
            { id: 'drinks', name: '🥤 飲料類 (中/大)', items: [
                { id: 'd1', name: '紅茶', price: 15, sizes: { '中杯': 0, '大杯': 5 }, options: [{ title: '甜度', choices: ['無糖', '微糖', '半糖', '全糖'] }, { title: '冰/熱', choices: ['冰', '去冰', '溫', '熱'] }] },
                { id: 'd2', name: '豆漿', price: 20, sizes: { '中杯': 0, '大杯': 5 } },
                { id: 'd3', name: '奶茶', price: 20, sizes: { '中杯': 0, '大杯': 5 } },
                { id: 'd4', name: '鮮奶茶', price: 25, sizes: { '中杯': 0, '大杯': 10 } }
            ]},
            { id: 'others', name: '🍳 單點 / 炸物', items: [
                { id: 'f1', name: '荷包蛋', price: 15 }, { id: 'f2', name: '薯條', price: 35 }, { id: 'f3', name: '雞塊(5塊)', price: 40 }, { id: 'f4', name: '煎餃(8顆)', price: 40 }
            ]}
        ];

        // 核心狀態管理
        let menuData = JSON.parse(localStorage.getItem('gh_breakfast_menu')) || INITIAL_MENU;
        let cart = [];
        let tempItem = null;
        let tempQty = 1;
        let isAdminMode = false;

        // 初始化與渲染
        function renderMenu() {
            const container = document.getElementById('menu-accordion');
            // 記住當前開啟的分類
            const openedCats = Array.from(document.querySelectorAll('.menu-content.open')).map(el => el.id.replace('content-', ''));
            
            container.innerHTML = '';
            menuData.forEach(cat => {
                const isOpen = openedCats.includes(cat.id);
                const section = document.createElement('div');
                section.className = `border border-gray-100 rounded-3xl bg-white overflow-hidden transition-all ${isAdminMode ? 'ring-2 ring-orange-400/50 shadow-orange-100' : 'shadow-sm'}`;
                
                section.innerHTML = `
                    <button onclick="toggleCategory('${cat.id}')" class="w-full flex justify-between items-center p-6 hover:bg-emerald-50 transition-colors">
                        <span class="font-black text-gray-700 tracking-tight">${cat.name}</span>
                        <svg id="arrow-${cat.id}" class="w-5 h-5 text-emerald-600 arrow-rotate ${isOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="content-${cat.id}" class="menu-content ${isOpen ? 'open px-4' : 'px-4'}">
                        <div class="pb-4 space-y-1 border-t border-gray-50 pt-2">
                            ${cat.items.map(item => `
                                <div class="flex justify-between items-center p-4 rounded-2xl hover:bg-slate-50 transition-all active:scale-[0.98]">
                                    <div onclick="openOrderModal('${cat.id}', '${item.id}')" class="flex-grow cursor-pointer">
                                        <p class="font-bold text-gray-800">${item.name}</p>
                                    </div>
                                    <div onclick="${isAdminMode ? `adminChangePrice('${cat.id}', '${item.id}')` : `openOrderModal('${cat.id}', '${item.id}')`}" 
                                         class="px-4 py-2 rounded-xl font-black transition-all ${isAdminMode ? 'admin-edit-pulse text-orange-600 cursor-help border-2 border-orange-200' : 'text-emerald-600'}">
                                        $${item.price}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });
        }

        // 分類開合
        function toggleCategory(id) {
            const content = document.getElementById(`content-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            content.classList.toggle('open');
            arrow.classList.toggle('rotate-180');
        }

        // 管理員：修改價格
        function toggleAdminMode() {
            isAdminMode = !isAdminMode;
            document.getElementById('admin-banner').classList.toggle('hidden', !isAdminMode);
            document.getElementById('admin-btn').classList.toggle('bg-orange-500', isAdminMode);
            renderMenu();
        }

        function adminChangePrice(catId, itemId) {
            const cat = menuData.find(c => c.id === catId);
            const item = cat.items.find(i => i.id === itemId);
            const newPrice = prompt(`[改價模式] 請輸入「${item.name}」的新基礎價格：`, item.price);
            
            if (newPrice !== null && !isNaN(newPrice) && newPrice !== "") {
                item.price = parseInt(newPrice);
                localStorage.setItem('gh_breakfast_menu', JSON.stringify(menuData));
                renderMenu();
            }
        }

        // 點餐邏輯
        function openOrderModal(catId, itemId) {
            if (isAdminMode) return;
            const cat = menuData.find(c => c.id === catId);
            tempItem = cat.items.find(i => i.id === itemId);
            tempQty = 1;

            document.getElementById('modal-title').innerText = tempItem.name;
            document.getElementById('modal-qty').innerText = tempQty;
            
            const optBox = document.getElementById('modal-options');
            optBox.innerHTML = '';
            
            if (tempItem.sizes) addOptionUI(optBox, '份量規格', Object.keys(tempItem.sizes), 'sizes');
            if (tempItem.types) addOptionUI(optBox, '品項類型', Object.keys(tempItem.types), 'types');
            if (tempItem.options) tempItem.options.forEach(o => addOptionUI(optBox, o.title, o.choices));
            if (tempItem.addCheese) addOptionUI(optBox, '額外加購', ['不加起司', '加起司 (+10)']);
            
            calcModalPrice();
            document.getElementById('modal').classList.remove('hidden');
        }

        function addOptionUI(box, title, choices, key) {
            const wrap = document.createElement('div');
            wrap.innerHTML = `
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">${title}</p>
                <div class="flex flex-wrap gap-2">
                    ${choices.map((c, idx) => {
                        let label = c;
                        if (key && tempItem[key][c] > 0) label += ` (+$${tempItem[key][c]})`;
                        return `<button onclick="handleOptionSelect(this)" class="choice-btn px-5 py-3 rounded-2xl border-2 font-bold transition-all ${idx===0?'bg-emerald-600 text-white border-emerald-600 shadow-md':'bg-white text-slate-500 border-slate-100'}">${label}</button>`;
                    }).join('')}
                </div>
            `;
            box.appendChild(wrap);
        }

        function handleOptionSelect(btn) {
            btn.parentElement.querySelectorAll('.choice-btn').forEach(b => {
                b.classList.replace('bg-emerald-600', 'bg-white');
                b.classList.replace('text-white', 'text-slate-500');
                b.classList.replace('border-emerald-600', 'border-slate-100');
                b.classList.remove('shadow-md');
            });
            btn.classList.replace('bg-white', 'bg-emerald-600');
            btn.classList.replace('text-slate-500', 'text-white');
            btn.classList.replace('border-slate-100', 'border-emerald-600');
            btn.classList.add('shadow-md');
            calcModalPrice();
        }

        function calcModalPrice() {
            let p = tempItem.price;
            document.querySelectorAll('.choice-btn.text-white').forEach(b => {
                const t = b.innerText;
                if (t.includes('+$')) p += parseInt(t.split('+$')[1]);
                else if (t.includes('+')) p += parseInt(t.split('+')[1]);
            });
            document.getElementById('modal-price-display').innerText = `$${p * tempQty}`;
        }

        function changeQty(v) {
            tempQty = Math.max(1, tempQty + v);
            document.getElementById('modal-qty').innerText = tempQty;
            calcModalPrice();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function addToCart() {
            const selections = [];
            let price = tempItem.price;
            document.querySelectorAll('.choice-btn.text-white').forEach(b => {
                const t = b.innerText;
                if (!t.includes("不加")) {
                    selections.push(t.trim());
                    if (t.includes('+$')) price += parseInt(t.split('+$')[1]);
                    else if (t.includes('+')) price += parseInt(t.split('+')[1]);
                }
            });
            cart.push({ name: tempItem.name, unit: price, qty: tempQty, opts: selections.join(' / ') });
            refreshCartUI();
            closeModal();
        }

        function refreshCartUI() {
            const total = cart.reduce((s, i) => s + (i.unit * i.qty), 0);
            const count = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-count').innerText = count;
        }

        function clearCart() { if(confirm('要清空目前的所有餐點嗎？')) { cart = []; refreshCartUI(); } }

        function saveUserData() { localStorage.setItem('user_name', document.getElementById('user-name').value); }

        function exportToLine() {
            const name = document.getElementById('user-name').value || '未署名';
            if (cart.length === 0) return alert('清單是空的喔！');
            
            let msg = `【早安！早餐點餐單】\n👤 訂購人：${name}\n━━━━━━━━━━━━━━\n`;
            cart.forEach((i, idx) => {
                msg += `${idx+1}. ${i.name} x ${i.qty}\n   ${i.opts ? `⤷ ${i.opts}` : ''}\n   💰 小計：$${i.unit * i.qty}\n`;
            });
            msg += `━━━━━━━━━━━━━━\n總金額：NT$ ${document.getElementById('cart-total').innerText}\n辛苦了，謝謝！`;
            
            const area = document.createElement('textarea');
            area.value = msg; document.body.appendChild(area); area.select();
            document.execCommand('copy'); document.body.removeChild(area);

            const hint = document.getElementById('copy-msg');
            hint.classList.remove('hidden');
            setTimeout(() => hint.classList.add('hidden'), 3000);
        }

        // 初始化
        document.getElementById('user-name').value = localStorage.getItem('user_name') || '';
        renderMenu();
    </script>
</body>
</html>
